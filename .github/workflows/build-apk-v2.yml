name: Build CircleTapAuto APK v2

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-apk-v2.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate v1 Android project
        shell: bash
        run: |
          set -e
          awk '
            /- name: Generate Android project/ { in_step=1; next }
            in_step && /run: \|/ { in_run=1; next }
            in_run && /^      - name:/ { exit }
            in_run { sub(/^          /, ""); print }
          ' .github/workflows/build-apk.yml > /tmp/generate-project.sh
          bash /tmp/generate-project.sh

      - name: Patch detector to v2 ring sampling
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_v2.py
          python /tmp/patch_v2.py
          grep -n "pointYellowHits\|requiredYellowPoints\|tapCooldownMs" app/src/main/java/com/example/circletapauto/ScreenCaptureService.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Copy APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CircleTapAuto-v2.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CircleTapAuto-v2-APK
          path: CircleTapAuto-v2.apk

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v2-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" CircleTapAuto-v2.apk --title "CircleTapAuto v2 build ${GITHUB_RUN_NUMBER}" --notes "v2: 바깥 원 테두리 8지점 동시 노랑 감지 방식" --latest
