name: Build CircleTapAuto APK v3 FAST

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-apk-v3.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate v1 Android project
        shell: bash
        run: |
          set -e
          awk '
            /- name: Generate Android project/ { in_step=1; next }
            in_step && /run: \|/ { in_run=1; next }
            in_run && /^      - name:/ { exit }
            in_run { sub(/^          /, ""); print }
          ' .github/workflows/build-apk.yml > /tmp/generate-project.sh
          bash /tmp/generate-project.sh

      - name: Patch detector to v3 fast mode
        shell: bash
        run: |
          echo '' | base64 -d > /tmp/patch_v3.py
          python /tmp/patch_v3.py
          grep -n "v3 FAST\|radii =\|requiredYellowPoints\|tapCooldownMs" app/src/main/java/com/example/circletapauto/ScreenCaptureService.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Copy APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CircleTapAuto-v3-FAST.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CircleTapAuto-v3-FAST-APK
          path: CircleTapAuto-v3-FAST.apk

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v3-fast-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" CircleTapAuto-v3-FAST.apk --title "CircleTapAuto v3 FAST ${GITHUB_RUN_NUMBER}" --notes "v3 FAST: 4개 반지름 x 8지점 선행 감지, 2지점 노랑이면 즉시 탭, 75ms 쿨다운" --latest
