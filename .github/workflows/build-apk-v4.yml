name: Build CircleTapAuto APK v4 COLOR FIX

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-apk-v4.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate base Android project
        shell: bash
        run: |
          set -e
          awk '
            /- name: Generate Android project/ { in_step=1; next }
            in_step && /run: \|/ { in_run=1; next }
            in_run && /^      - name:/ { exit }
            in_run { sub(/^          /, ""); print }
          ' .github/workflows/build-apk.yml > /tmp/generate-project.sh
          bash /tmp/generate-project.sh

      - name: Replace ScreenCaptureService completely
        shell: bash
        run: |
          cat > app/src/main/java/com/example/circletapauto/ScreenCaptureService.kt <<'EOF_KT'
          package com.example.circletapauto

          import android.app.Activity
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.Image
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Handler
          import android.os.HandlerThread
          import android.os.IBinder
          import android.os.SystemClock
          import android.util.DisplayMetrics
          import android.view.WindowManager
          import androidx.core.app.NotificationCompat
          import java.nio.ByteBuffer
          import kotlin.math.max
          import kotlin.math.min

          class ScreenCaptureService : Service() {

              private var projection: MediaProjection? = null
              private var virtualDisplay: VirtualDisplay? = null
              private var imageReader: ImageReader? = null
              private var workerThread: HandlerThread? = null
              private var workerHandler: Handler? = null

              private var lastTapAt = 0L
              private var lastFrameAt = 0L
              private var previousYellowRatio = 0f

              override fun onCreate() {
                  super.onCreate()
                  createNotificationChannel()
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_STOP -> {
                          stopCapture()
                          stopSelf()
                          return START_NOT_STICKY
                      }
                      ACTION_START -> startCapture(intent)
                  }
                  return START_NOT_STICKY
              }

              @Suppress("DEPRECATION")
              private fun startCapture(intent: Intent) {
                  val notification = NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_menu_view)
                      .setContentTitle("Circle Tap Auto")
                      .setContentText("노란색 타이밍 감지 중")
                      .setOngoing(true)
                      .build()

                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(
                          NOTIFICATION_ID,
                          notification,
                          ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION
                      )
                  } else {
                      startForeground(NOTIFICATION_ID, notification)
                  }

                  if (projection != null) return

                  val resultCode = intent.getIntExtra(EXTRA_RESULT_CODE, Activity.RESULT_CANCELED)
                  val resultData: Intent? = if (Build.VERSION.SDK_INT >= 33) {
                      intent.getParcelableExtra(EXTRA_RESULT_DATA, Intent::class.java)
                  } else {
                      intent.getParcelableExtra(EXTRA_RESULT_DATA)
                  }

                  if (resultCode != Activity.RESULT_OK || resultData == null) {
                      stopSelf()
                      return
                  }

                  val metrics = getScreenMetrics()
                  val width = metrics[0]
                  val height = metrics[1]
                  val densityDpi = metrics[2]

                  imageReader = ImageReader.newInstance(width, height, PixelFormat.RGBA_8888, 2)

                  workerThread = HandlerThread("YellowDetector").apply { start() }
                  workerHandler = Handler(workerThread!!.looper)

                  val manager = getSystemService(MediaProjectionManager::class.java)
                  projection = manager.getMediaProjection(resultCode, resultData)

                  projection?.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() {
                          stopCapture()
                          stopSelf()
                      }
                  }, workerHandler)

                  virtualDisplay = projection?.createVirtualDisplay(
                      "CircleTapCapture",
                      width,
                      height,
                      densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                      imageReader!!.surface,
                      null,
                      workerHandler
                  )

                  imageReader?.setOnImageAvailableListener({ reader ->
                      val now = SystemClock.elapsedRealtime()

                      // 약 60fps. 지나치게 오래된 프레임은 버리고 항상 최신 화면만 사용.
                      if (now - lastFrameAt < 14L) {
                          reader.acquireLatestImage()?.close()
                          return@setOnImageAvailableListener
                      }
                      lastFrameAt = now

                      reader.acquireLatestImage()?.use { image ->
                          detectAndTap(image)
                      }
                  }, workerHandler)
              }

              private fun detectAndTap(image: Image) {
                  val width = image.width
                  val height = image.height
                  val plane = image.planes.firstOrNull() ?: return
                  val buffer = plane.buffer
                  val pixelStride = plane.pixelStride
                  val rowStride = plane.rowStride

                  // 제공된 게임 화면 기준 중앙 원 위치.
                  val cx = (width * 0.50f).toInt()
                  val cy = (height * 0.507f).toInt()

                  // 원이 콤보 때문에 울퉁불퉁해져도 대응하도록
                  // 넓은 도넛 영역 전체의 "노란색 면적"을 본다.
                  val innerR = width * 0.15f
                  val outerR = width * 0.33f
                  val innerR2 = innerR * innerR
                  val outerR2 = outerR * outerR

                  // 너무 촘촘히 읽으면 느려지므로 적당히 샘플링.
                  val step = max(3, width / 270)

                  var yellowCount = 0
                  var totalCount = 0

                  val left = max(0, (cx - outerR).toInt())
                  val right = min(width - 1, (cx + outerR).toInt())
                  val top = max(0, (cy - outerR).toInt())
                  val bottom = min(height - 1, (cy + outerR).toInt())

                  var y = top
                  while (y <= bottom) {
                      var x = left
                      while (x <= right) {
                          val dx = (x - cx).toFloat()
                          val dy = (y - cy).toFloat()
                          val d2 = dx * dx + dy * dy

                          if (d2 >= innerR2 && d2 <= outerR2) {
                              totalCount++
                              if (isYellow(buffer, rowStride, pixelStride, x, y)) {
                                  yellowCount++
                              }
                          }

                          x += step
                      }
                      y += step
                  }

                  if (totalCount == 0) return

                  val ratio = yellowCount.toFloat() / totalCount.toFloat()
                  val rise = ratio - previousYellowRatio

                  // 현재 프레임 기준치를 먼저 보존.
                  previousYellowRatio = ratio

                  val now = SystemClock.elapsedRealtime()

                  // 네가 보여준 실제 노랑 링은 면적이 꽤 크므로
                  // 1) 충분히 많은 노랑이 있거나
                  // 2) 직전 프레임 대비 노랑이 갑자기 증가하면 탭.
                  //
                  // rise 조건은 "노랑이 시작되는 첫 순간"을 빠르게 잡기 위한 것.
                  val strongYellow = ratio >= 0.045f
                  val suddenRise = ratio >= 0.020f && rise >= 0.012f
                  val yellowNow = strongYellow || suddenRise

                  if (yellowNow && now - lastTapAt >= 110L) {
                      if (AutoTapAccessibilityService.tapScreen(cx.toFloat(), cy.toFloat())) {
                          lastTapAt = now

                          // 같은 노랑 상태에서 연속 탭하는 것을 막고
                          // 다음 라운드의 변화량 계산이 쉽게 다시 시작되도록 초기화.
                          previousYellowRatio = 0f
                      }
                  }
              }

              private fun isYellow(
                  buffer: ByteBuffer,
                  rowStride: Int,
                  pixelStride: Int,
                  x: Int,
                  y: Int
              ): Boolean {
                  val offset = y * rowStride + x * pixelStride
                  if (offset < 0 || offset + 2 >= buffer.limit()) return false

                  val r = buffer.get(offset).toInt() and 0xFF
                  val g = buffer.get(offset + 1).toInt() and 0xFF
                  val b = buffer.get(offset + 2).toInt() and 0xFF

                  // 실제 스크린샷의 밝은 노랑/금색 링에 맞춘 판정.
                  // 갈색/주황 배경, 흰색/회색은 최대한 제외.
                  return r >= 205 &&
                      g >= 165 &&
                      b <= 145 &&
                      (r + g) >= 390 &&
                      (r - b) >= 75 &&
                      (g - b) >= 45 &&
                      g * 100 >= r * 68
              }

              private fun getScreenMetrics(): IntArray {
                  return if (Build.VERSION.SDK_INT >= 30) {
                      val wm = getSystemService(WindowManager::class.java)
                      val bounds = wm.currentWindowMetrics.bounds
                      val dm = resources.displayMetrics
                      intArrayOf(bounds.width(), bounds.height(), dm.densityDpi)
                  } else {
                      @Suppress("DEPRECATION")
                      val display = (getSystemService(WINDOW_SERVICE) as WindowManager).defaultDisplay
                      val metrics = DisplayMetrics()
                      @Suppress("DEPRECATION")
                      display.getRealMetrics(metrics)
                      intArrayOf(metrics.widthPixels, metrics.heightPixels, metrics.densityDpi)
                  }
              }

              private fun stopCapture() {
                  try {
                      imageReader?.setOnImageAvailableListener(null, null)
                  } catch (_: Exception) {
                  }

                  imageReader?.close()
                  imageReader = null

                  virtualDisplay?.release()
                  virtualDisplay = null

                  projection?.stop()
                  projection = null

                  workerThread?.quitSafely()
                  workerThread = null
                  workerHandler = null

                  previousYellowRatio = 0f
                  lastFrameAt = 0L
              }

              override fun onDestroy() {
                  stopCapture()
                  super.onDestroy()
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      val channel = NotificationChannel(
                          CHANNEL_ID,
                          "Circle Tap Auto",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      getSystemService(NotificationManager::class.java)
                          .createNotificationChannel(channel)
                  }
              }

              companion object {
                  const val ACTION_START = "com.example.circletapauto.START"
                  const val ACTION_STOP = "com.example.circletapauto.STOP"
                  const val EXTRA_RESULT_CODE = "resultCode"
                  const val EXTRA_RESULT_DATA = "resultData"

                  private const val CHANNEL_ID = "circle_tap_auto"
                  private const val NOTIFICATION_ID = 1
              }
          }
          EOF_KT

      - name: Verify generated Kotlin
        run: |
          grep -n "previousYellowRatio\|getScreenMetrics\|strongYellow\|suddenRise" \
            app/src/main/java/com/example/circletapauto/ScreenCaptureService.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Copy APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CircleTapAuto-v4-COLOR-FIX.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CircleTapAuto-v4-COLOR-FIX-APK
          path: CircleTapAuto-v4-COLOR-FIX.apk

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v4-color-fix-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" CircleTapAuto-v4-COLOR-FIX.apk \
            --title "CircleTapAuto v4 COLOR FIX ${GITHUB_RUN_NUMBER}" \
            --notes "v4 COLOR FIX: ScreenCaptureService 전체 교체. 울퉁불퉁한 원도 모양 무시하고 도넛 영역의 실제 노란색 면적 + 프레임간 증가량으로 감지." \
            --latest
