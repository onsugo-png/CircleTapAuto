name: Build CircleTapAuto APK v6 PREDICT

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-apk-v6.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate base Android project
        shell: bash
        run: |
          set -e
          awk '
            /- name: Generate Android project/ { in_step=1; next }
            in_step && /run: \|/ { in_run=1; next }
            in_run && /^      - name:/ { exit }
            in_run { sub(/^          /, ""); print }
          ' .github/workflows/build-apk.yml > /tmp/generate-project.sh
          bash /tmp/generate-project.sh

      - name: Replace ScreenCaptureService with v6 predictive detector
        shell: bash
        run: |
          cat > app/src/main/java/com/example/circletapauto/ScreenCaptureService.kt <<'EOF_KT'
          package com.example.circletapauto

          import android.app.Activity
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.Image
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Handler
          import android.os.HandlerThread
          import android.os.IBinder
          import android.os.SystemClock
          import android.util.DisplayMetrics
          import android.view.WindowManager
          import androidx.core.app.NotificationCompat
          import java.nio.ByteBuffer
          import kotlin.math.abs
          import kotlin.math.cos
          import kotlin.math.max
          import kotlin.math.min
          import kotlin.math.sin

          class ScreenCaptureService : Service() {

              private var projection: MediaProjection? = null
              private var virtualDisplay: VirtualDisplay? = null
              private var imageReader: ImageReader? = null
              private var workerThread: HandlerThread? = null
              private var workerHandler: Handler? = null

              private var lastTapAt = 0L
              private var previousInnerRadius = -1f
              private var previousRadiusAt = 0L
              private var armed = true

              override fun onCreate() {
                  super.onCreate()
                  createNotificationChannel()
              }

              override fun onBind(intent: Intent?): IBinder? = null

              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_STOP -> {
                          stopCapture()
                          stopSelf()
                          return START_NOT_STICKY
                      }
                      ACTION_START -> startCapture(intent)
                  }
                  return START_NOT_STICKY
              }

              @Suppress("DEPRECATION")
              private fun startCapture(intent: Intent) {
                  val notification = NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_menu_view)
                      .setContentTitle("Circle Tap Auto")
                      .setContentText("원 접촉 시점 예측 중")
                      .setOngoing(true)
                      .build()

                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(
                          NOTIFICATION_ID,
                          notification,
                          ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION
                      )
                  } else {
                      startForeground(NOTIFICATION_ID, notification)
                  }

                  if (projection != null) return

                  val resultCode = intent.getIntExtra(EXTRA_RESULT_CODE, Activity.RESULT_CANCELED)
                  val resultData: Intent? = if (Build.VERSION.SDK_INT >= 33) {
                      intent.getParcelableExtra(EXTRA_RESULT_DATA, Intent::class.java)
                  } else {
                      intent.getParcelableExtra(EXTRA_RESULT_DATA)
                  }

                  if (resultCode != Activity.RESULT_OK || resultData == null) {
                      stopSelf()
                      return
                  }

                  val metrics = getScreenMetrics()
                  val width = metrics[0]
                  val height = metrics[1]
                  val densityDpi = metrics[2]

                  imageReader = ImageReader.newInstance(
                      width, height, PixelFormat.RGBA_8888, 2
                  )

                  workerThread = HandlerThread("RingPredictor").apply { start() }
                  workerHandler = Handler(workerThread!!.looper)

                  val manager = getSystemService(MediaProjectionManager::class.java)
                  projection = manager.getMediaProjection(resultCode, resultData)

                  projection?.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() {
                          stopCapture()
                          stopSelf()
                      }
                  }, workerHandler)

                  virtualDisplay = projection?.createVirtualDisplay(
                      "CircleTapCapture",
                      width,
                      height,
                      densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                      imageReader!!.surface,
                      null,
                      workerHandler
                  )

                  imageReader?.setOnImageAvailableListener({ reader ->
                      // acquireLatestImage()만 사용해서 큐에 쌓인 오래된 프레임은 버린다.
                      reader.acquireLatestImage()?.use { image ->
                          detectAndTap(image)
                      }
                  }, workerHandler)
              }

              private fun detectAndTap(image: Image) {
                  val width = image.width
                  val height = image.height
                  val plane = image.planes.firstOrNull() ?: return
                  val buffer = plane.buffer
                  val pixelStride = plane.pixelStride
                  val rowStride = plane.rowStride

                  val cx = (width * 0.50f).toInt()
                  val cy = (height * 0.507f).toInt()

                  // v6:
                  // 색이 아니라 흰색/밝은 경계선의 반지름을 여러 방향에서 직접 측정.
                  // 콤보로 원이 울퉁불퉁해져도 64방향 히스토그램의 피크를 사용한다.
                  val sectors = 64
                  val minR = (width * 0.10f).toInt()
                  val maxR = (width * 0.34f).toInt()
                  val radiusStep = 2
                  val binCount = ((maxR - minR) / radiusStep) + 1
                  val hits = IntArray(binCount)

                  for (i in 0 until sectors) {
                      val angle = Math.PI * 2.0 * i.toDouble() / sectors.toDouble()
                      val ca = cos(angle).toFloat()
                      val sa = sin(angle).toFloat()

                      var r = minR
                      var bin = 0
                      while (r <= maxR && bin < binCount) {
                          val x = (cx + ca * r).toInt()
                          val y = (cy + sa * r).toInt()

                          if (x in 0 until width && y in 0 until height &&
                              isWhiteEdge(buffer, rowStride, pixelStride, x, y)) {
                              hits[bin]++
                          }

                          r += radiusStep
                          bin++
                      }
                  }

                  // 64방향 중 최소 12방향 이상에서 검출된 반지름들을 연속 그룹으로 묶는다.
                  val groups = ArrayList<RadiusGroup>()
                  var i = 0
                  while (i < hits.size) {
                      if (hits[i] < 12) {
                          i++
                          continue
                      }

                      var end = i
                      var weighted = 0f
                      var weight = 0
                      var peak = 0

                      while (end < hits.size && hits[end] >= 10) {
                          val radius = minR + end * radiusStep
                          weighted += radius * hits[end]
                          weight += hits[end]
                          peak = max(peak, hits[end])
                          end++
                      }

                      if (weight > 0) {
                          groups.add(
                              RadiusGroup(
                                  radius = weighted / weight.toFloat(),
                                  peak = peak
                              )
                          )
                      }
                      i = end
                  }

                  if (groups.size < 2) {
                      previousInnerRadius = -1f
                      previousRadiusAt = 0L
                      return
                  }

                  // 가장 바깥쪽 강한 흰 경계를 목표 원으로 본다.
                  // 그 안쪽에서 가장 가까운 강한 경계를 커지는 원으로 본다.
                  val strongGroups = groups.filter { it.peak >= 14 }
                  if (strongGroups.size < 2) return

                  val outer = strongGroups.maxByOrNull { it.radius } ?: return
                  val innerCandidates = strongGroups
                      .filter { it.radius < outer.radius - 8f }
                      .sortedByDescending { it.radius }

                  if (innerCandidates.isEmpty()) return
                  val inner = innerCandidates.first()

                  val gap = outer.radius - inner.radius
                  val now = SystemClock.elapsedRealtime()

                  // 새 라운드: 두 원이 충분히 멀어지면 다시 발사 준비.
                  if (gap >= 34f) {
                      armed = true
                  }

                  var speedPxPerMs = 0f
                  if (previousInnerRadius > 0f && previousRadiusAt > 0L) {
                      val dt = (now - previousRadiusAt).coerceAtLeast(1L)
                      val dr = inner.radius - previousInnerRadius

                      // 안쪽 원이 커지는 방향의 속도만 사용.
                      if (dr > 0f && dr < width * 0.08f) {
                          speedPxPerMs = dr / dt.toFloat()
                      }
                  }

                  previousInnerRadius = inner.radius
                  previousRadiusAt = now

                  // 현재 gap만 보고 누르면 뒤쪽 고속 구간에서 늦는다.
                  // 접근 속도에 따라 약 28ms 앞의 위치를 예측해서 선행 탭한다.
                  val predictionMs = 28f
                  val predictedGap = gap - speedPxPerMs * predictionMs

                  // 저속에서는 8px 근처까지 기다리고,
                  // 고속에서는 속도에 비례해 조금 더 일찍 발사.
                  val dynamicThreshold = max(
                      8f,
                      min(18f, 7f + speedPxPerMs * 42f)
                  )

                  if (
                      armed &&
                      predictedGap <= dynamicThreshold &&
                      gap > 1f &&
                      now - lastTapAt >= 70L
                  ) {
                      if (AutoTapAccessibilityService.tapScreen(
                              cx.toFloat(),
                              cy.toFloat()
                          )
                      ) {
                          lastTapAt = now
                          armed = false
                      }
                  }
              }

              private fun isWhiteEdge(
                  buffer: ByteBuffer,
                  rowStride: Int,
                  pixelStride: Int,
                  x: Int,
                  y: Int
              ): Boolean {
                  val offset = y * rowStride + x * pixelStride
                  if (offset < 0 || offset + 2 >= buffer.limit()) return false

                  val r = buffer.get(offset).toInt() and 0xFF
                  val g = buffer.get(offset + 1).toInt() and 0xFF
                  val b = buffer.get(offset + 2).toInt() and 0xFF

                  val maxC = max(r, max(g, b))
                  val minC = min(r, min(g, b))
                  val chroma = maxC - minC

                  // 배경색과 무관하게 흰색/아주 밝은 회백색 경계만 잡는다.
                  // 안티앨리어싱 때문에 완전 255만 요구하지 않는다.
                  return minC >= 205 &&
                      maxC >= 225 &&
                      chroma <= 52
              }

              private fun getScreenMetrics(): IntArray {
                  return if (Build.VERSION.SDK_INT >= 30) {
                      val wm = getSystemService(WindowManager::class.java)
                      val bounds = wm.currentWindowMetrics.bounds
                      val dm = resources.displayMetrics
                      intArrayOf(bounds.width(), bounds.height(), dm.densityDpi)
                  } else {
                      @Suppress("DEPRECATION")
                      val display =
                          (getSystemService(WINDOW_SERVICE) as WindowManager).defaultDisplay
                      val metrics = DisplayMetrics()
                      @Suppress("DEPRECATION")
                      display.getRealMetrics(metrics)
                      intArrayOf(
                          metrics.widthPixels,
                          metrics.heightPixels,
                          metrics.densityDpi
                      )
                  }
              }

              private fun stopCapture() {
                  try {
                      imageReader?.setOnImageAvailableListener(null, null)
                  } catch (_: Exception) {
                  }

                  imageReader?.close()
                  imageReader = null

                  virtualDisplay?.release()
                  virtualDisplay = null

                  projection?.stop()
                  projection = null

                  workerThread?.quitSafely()
                  workerThread = null
                  workerHandler = null

                  previousInnerRadius = -1f
                  previousRadiusAt = 0L
                  armed = true
              }

              override fun onDestroy() {
                  stopCapture()
                  super.onDestroy()
              }

              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      val channel = NotificationChannel(
                          CHANNEL_ID,
                          "Circle Tap Auto",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      getSystemService(NotificationManager::class.java)
                          .createNotificationChannel(channel)
                  }
              }

              private data class RadiusGroup(
                  val radius: Float,
                  val peak: Int
              )

              companion object {
                  const val ACTION_START = "com.example.circletapauto.START"
                  const val ACTION_STOP = "com.example.circletapauto.STOP"
                  const val EXTRA_RESULT_CODE = "resultCode"
                  const val EXTRA_RESULT_DATA = "resultData"

                  private const val CHANNEL_ID = "circle_tap_auto"
                  private const val NOTIFICATION_ID = 1
              }
          }
          EOF_KT

      - name: Verify v6 detector
        run: |
          grep -n "predictionMs\|dynamicThreshold\|RadiusGroup\|isWhiteEdge" \
            app/src/main/java/com/example/circletapauto/ScreenCaptureService.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Copy APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CircleTapAuto-v6-PREDICT.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CircleTapAuto-v6-PREDICT-APK
          path: CircleTapAuto-v6-PREDICT.apk

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v6-predict-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" CircleTapAuto-v6-PREDICT.apk \
            --title "CircleTapAuto v6 PREDICT ${GITHUB_RUN_NUMBER}" \
            --notes "v6: 색상 감지 제거. 64방향 흰 경계 반지름 측정 + 접근 속도 기반 28ms 선행 예측으로 고속 구간 대응." \
            --latest
