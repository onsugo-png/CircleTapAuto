name: Build CircleTapAuto APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Android project
        shell: bash
        run: |
          set -e
          cat > settings.gradle.kts <<'EOF_CIRCLETAP_0'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CircleTapAuto"
          include(":app")
          EOF_CIRCLETAP_0

          cat > build.gradle.kts <<'EOF_CIRCLETAP_1'
          plugins {
              id("com.android.application") version "8.9.1" apply false
              id("org.jetbrains.kotlin.android") version "2.1.20" apply false
          }
          EOF_CIRCLETAP_1

          cat > gradle.properties <<'EOF_CIRCLETAP_2'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF_CIRCLETAP_2

          mkdir -p app
          cat > app/build.gradle.kts <<'EOF_CIRCLETAP_3'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          
          android {
              namespace = "com.example.circletapauto"
              compileSdk = 35
          
              defaultConfig {
                  applicationId = "com.example.circletapauto"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
          
              buildFeatures {
                  viewBinding = false
              }
          
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          
          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.appcompat:appcompat:1.7.0")
              implementation("com.google.android.material:material:1.12.0")
          }
          EOF_CIRCLETAP_3

          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml <<'EOF_CIRCLETAP_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
          
              <application
                  android:allowBackup="true"
                  android:label="Circle Tap Auto"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.CircleTapAuto">
          
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
          
                  <service
                      android:name=".ScreenCaptureService"
                      android:exported="false"
                      android:foregroundServiceType="mediaProjection" />
          
                  <service
                      android:name=".AutoTapAccessibilityService"
                      android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                      android:exported="false">
                      <intent-filter>
                          <action android:name="android.accessibilityservice.AccessibilityService" />
                      </intent-filter>
                      <meta-data
                          android:name="android.accessibilityservice"
                          android:resource="@xml/accessibility_service_config" />
                  </service>
          
              </application>
          </manifest>
          EOF_CIRCLETAP_4

          mkdir -p app/src/main/java/com/example/circletapauto
          cat > app/src/main/java/com/example/circletapauto/AutoTapAccessibilityService.kt <<'EOF_CIRCLETAP_5'
          package com.example.circletapauto
          
          import android.accessibilityservice.AccessibilityService
          import android.accessibilityservice.GestureDescription
          import android.graphics.Path
          import android.view.accessibility.AccessibilityEvent
          
          class AutoTapAccessibilityService : AccessibilityService() {
          
              override fun onServiceConnected() {
                  instance = this
              }
          
              override fun onAccessibilityEvent(event: AccessibilityEvent?) = Unit
              override fun onInterrupt() = Unit
          
              override fun onDestroy() {
                  if (instance === this) instance = null
                  super.onDestroy()
              }
          
              fun tap(x: Float, y: Float) {
                  val path = Path().apply { moveTo(x, y) }
                  val gesture = GestureDescription.Builder()
                      .addStroke(GestureDescription.StrokeDescription(path, 0, 35))
                      .build()
                  dispatchGesture(gesture, null, null)
              }
          
              companion object {
                  @Volatile private var instance: AutoTapAccessibilityService? = null
          
                  fun isRunning(): Boolean = instance != null
          
                  fun tapScreen(x: Float, y: Float): Boolean {
                      val service = instance ?: return false
                      service.tap(x, y)
                      return true
                  }
              }
          }
          EOF_CIRCLETAP_5

          mkdir -p app/src/main/java/com/example/circletapauto
          cat > app/src/main/java/com/example/circletapauto/MainActivity.kt <<'EOF_CIRCLETAP_6'
          package com.example.circletapauto
          
          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Button
          import android.widget.TextView
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import androidx.core.content.ContextCompat
          
          class MainActivity : AppCompatActivity() {
          
              private lateinit var projectionManager: MediaProjectionManager
              private lateinit var statusText: TextView
          
              private val screenCaptureLauncher =
                  registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { result ->
                      if (result.resultCode == Activity.RESULT_OK && result.data != null) {
                          val serviceIntent = Intent(this, ScreenCaptureService::class.java).apply {
                              action = ScreenCaptureService.ACTION_START
                              putExtra(ScreenCaptureService.EXTRA_RESULT_CODE, result.resultCode)
                              putExtra(ScreenCaptureService.EXTRA_RESULT_DATA, result.data)
                          }
                          ContextCompat.startForegroundService(this, serviceIntent)
                          statusText.text = "감지 중입니다. 게임으로 돌아가세요.\n노란색 감지 시 자동 터치합니다."
                      } else {
                          statusText.text = "화면 공유 권한이 취소되었습니다."
                      }
                  }
          
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContentView(R.layout.activity_main)
          
                  projectionManager = getSystemService(MediaProjectionManager::class.java)
                  statusText = findViewById(R.id.statusText)
          
                  if (Build.VERSION.SDK_INT >= 33) {
                      ActivityCompat.requestPermissions(
                          this,
                          arrayOf(Manifest.permission.POST_NOTIFICATIONS),
                          100
                      )
                  }
          
                  findViewById<Button>(R.id.accessibilityButton).setOnClickListener {
                      startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                  }
          
                  findViewById<Button>(R.id.startButton).setOnClickListener {
                      if (!AutoTapAccessibilityService.isRunning()) {
                          statusText.text = "먼저 접근성 설정에서 Circle Tap Auto를 켜주세요."
                          startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                          return@setOnClickListener
                      }
                      screenCaptureLauncher.launch(projectionManager.createScreenCaptureIntent())
                  }
          
                  findViewById<Button>(R.id.stopButton).setOnClickListener {
                      val intent = Intent(this, ScreenCaptureService::class.java).apply {
                          action = ScreenCaptureService.ACTION_STOP
                      }
                      startService(intent)
                      statusText.text = "감지를 중지했습니다."
                  }
              }
          
              override fun onResume() {
                  super.onResume()
                  if (AutoTapAccessibilityService.isRunning()) {
                      statusText.text = "접근성 권한: 켜짐\n감지 시작을 누르면 화면 공유가 시작됩니다."
                  }
              }
          }
          EOF_CIRCLETAP_6

          mkdir -p app/src/main/java/com/example/circletapauto
          cat > app/src/main/java/com/example/circletapauto/ScreenCaptureService.kt <<'EOF_CIRCLETAP_7'
          package com.example.circletapauto
          
          import android.app.*
          import android.content.Context
          import android.content.Intent
          import android.content.pm.ServiceInfo
          import android.graphics.PixelFormat
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.Image
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.Build
          import android.os.Handler
          import android.os.HandlerThread
          import android.os.IBinder
          import android.os.SystemClock
          import android.util.DisplayMetrics
          import android.view.WindowManager
          import androidx.core.app.NotificationCompat
          import java.nio.ByteBuffer
          import kotlin.math.max
          import kotlin.math.min
          
          class ScreenCaptureService : Service() {
          
              private var projection: MediaProjection? = null
              private var virtualDisplay: VirtualDisplay? = null
              private var imageReader: ImageReader? = null
              private var workerThread: HandlerThread? = null
              private var workerHandler: Handler? = null
          
              private var yellowLatched = false
              private var lastTapAt = 0L
              private var lastFrameAt = 0L
          
              override fun onCreate() {
                  super.onCreate()
                  createNotificationChannel()
              }
          
              override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                  when (intent?.action) {
                      ACTION_STOP -> {
                          stopCapture()
                          stopSelf()
                          return START_NOT_STICKY
                      }
                      ACTION_START -> startCapture(intent)
                  }
                  return START_NOT_STICKY
              }
          
              @Suppress("DEPRECATION")
              private fun startCapture(intent: Intent) {
                  val notification = NotificationCompat.Builder(this, CHANNEL_ID)
                      .setSmallIcon(android.R.drawable.ic_menu_view)
                      .setContentTitle("Circle Tap Auto")
                      .setContentText("노란색 타이밍 감지 중")
                      .setOngoing(true)
                      .build()
          
                  if (Build.VERSION.SDK_INT >= 29) {
                      startForeground(
                          NOTIFICATION_ID,
                          notification,
                          ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION
                      )
                  } else {
                      startForeground(NOTIFICATION_ID, notification)
                  }
          
                  if (projection != null) return
          
                  val resultCode = intent.getIntExtra(EXTRA_RESULT_CODE, Activity.RESULT_CANCELED)
                  val resultData: Intent? = if (Build.VERSION.SDK_INT >= 33) {
                      intent.getParcelableExtra(EXTRA_RESULT_DATA, Intent::class.java)
                  } else {
                      intent.getParcelableExtra(EXTRA_RESULT_DATA)
                  }
                  if (resultCode != Activity.RESULT_OK || resultData == null) {
                      stopSelf()
                      return
                  }
          
                  val (width, height, densityDpi) = getScreenMetrics()
                  imageReader = ImageReader.newInstance(width, height, PixelFormat.RGBA_8888, 2)
          
                  workerThread = HandlerThread("YellowDetector").apply { start() }
                  workerHandler = Handler(workerThread!!.looper)
          
                  val manager = getSystemService(MediaProjectionManager::class.java)
                  projection = manager.getMediaProjection(resultCode, resultData)
                  projection?.registerCallback(object : MediaProjection.Callback() {
                      override fun onStop() {
                          stopCapture()
                          stopSelf()
                      }
                  }, workerHandler)
          
                  virtualDisplay = projection?.createVirtualDisplay(
                      "CircleTapCapture",
                      width,
                      height,
                      densityDpi,
                      DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR,
                      imageReader!!.surface,
                      null,
                      workerHandler
                  )
          
                  imageReader?.setOnImageAvailableListener({ reader ->
                      val now = SystemClock.elapsedRealtime()
                      if (now - lastFrameAt < 16) {
                          reader.acquireLatestImage()?.close()
                          return@setOnImageAvailableListener
                      }
                      lastFrameAt = now
                      reader.acquireLatestImage()?.use { image ->
                          detectAndTap(image)
                      }
                  }, workerHandler)
              }
          
              private fun detectAndTap(image: Image) {
                  val width = image.width
                  val height = image.height
                  val plane = image.planes.firstOrNull() ?: return
                  val buffer = plane.buffer
                  val pixelStride = plane.pixelStride
                  val rowStride = plane.rowStride
          
                  // 제공된 화면 기준 원 중심은 대략 화면 너비 50%, 높이 50.7% 지점.
                  val cx = (width * 0.50f).toInt()
                  val cy = (height * 0.507f).toInt()
          
                  // 원이 있는 중앙 영역만 검사. 전체 화면을 읽지 않아 반응 속도를 높임.
                  val halfW = (width * 0.31f).toInt()
                  val halfH = (width * 0.31f).toInt()
                  val left = max(0, cx - halfW)
                  val right = min(width - 1, cx + halfW)
                  val top = max(0, cy - halfH)
                  val bottom = min(height - 1, cy + halfH)
          
                  var yellowCount = 0
                  var samples = 0
                  val step = max(2, width / 360) // 고해상도에서도 충분히 촘촘하게 샘플링
          
                  var y = top
                  while (y <= bottom) {
                      var x = left
                      while (x <= right) {
                          if (isYellow(buffer, rowStride, pixelStride, x, y)) {
                              yellowCount++
                              if (yellowCount >= YELLOW_PIXEL_THRESHOLD) break
                          }
                          samples++
                          x += step
                      }
                      if (yellowCount >= YELLOW_PIXEL_THRESHOLD) break
                      y += step
                  }
          
                  val yellowNow = yellowCount >= YELLOW_PIXEL_THRESHOLD
                  val now = SystemClock.elapsedRealtime()
          
                  if (yellowNow && !yellowLatched && now - lastTapAt >= TAP_COOLDOWN_MS) {
                      if (AutoTapAccessibilityService.tapScreen(cx.toFloat(), cy.toFloat())) {
                          lastTapAt = now
                          yellowLatched = true
                      }
                  } else if (!yellowNow) {
                      yellowLatched = false
                  }
              }
          
              private fun isYellow(
                  buffer: ByteBuffer,
                  rowStride: Int,
                  pixelStride: Int,
                  x: Int,
                  y: Int
              ): Boolean {
                  val offset = y * rowStride + x * pixelStride
                  if (offset < 0 || offset + 2 >= buffer.limit()) return false
          
                  val r = buffer.get(offset).toInt() and 0xFF
                  val g = buffer.get(offset + 1).toInt() and 0xFF
                  val b = buffer.get(offset + 2).toInt() and 0xFF
          
                  // 노랑/금색 계열: R,G가 높고 B가 낮은 픽셀.
                  // 실제 게임 색상이 조금 달라도 잡히도록 범위를 넓혀둠.
                  return r >= 175 &&
                      g >= 125 &&
                      b <= 150 &&
                      r - b >= 45 &&
                      g - b >= 25
              }
          
              private fun getScreenMetrics(): Triple<Int, Int, Int> {
                  val wm = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                  return if (Build.VERSION.SDK_INT >= 30) {
                      val bounds = wm.maximumWindowMetrics.bounds
                      val dm = resources.displayMetrics
                      Triple(bounds.width(), bounds.height(), dm.densityDpi)
                  } else {
                      @Suppress("DEPRECATION")
                      val dm = DisplayMetrics().also { wm.defaultDisplay.getRealMetrics(it) }
                      Triple(dm.widthPixels, dm.heightPixels, dm.densityDpi)
                  }
              }
          
              private fun stopCapture() {
                  imageReader?.setOnImageAvailableListener(null, null)
                  virtualDisplay?.release()
                  virtualDisplay = null
                  imageReader?.close()
                  imageReader = null
                  projection?.stop()
                  projection = null
                  workerThread?.quitSafely()
                  workerThread = null
                  workerHandler = null
                  stopForeground(STOP_FOREGROUND_REMOVE)
              }
          
              override fun onDestroy() {
                  stopCapture()
                  super.onDestroy()
              }
          
              override fun onBind(intent: Intent?): IBinder? = null
          
              private fun createNotificationChannel() {
                  if (Build.VERSION.SDK_INT >= 26) {
                      val channel = NotificationChannel(
                          CHANNEL_ID,
                          "화면 감지",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      getSystemService(NotificationManager::class.java).createNotificationChannel(channel)
                  }
              }
          
              companion object {
                  const val ACTION_START = "com.example.circletapauto.START"
                  const val ACTION_STOP = "com.example.circletapauto.STOP"
                  const val EXTRA_RESULT_CODE = "resultCode"
                  const val EXTRA_RESULT_DATA = "resultData"
          
                  private const val CHANNEL_ID = "circle_tap_capture"
                  private const val NOTIFICATION_ID = 1
                  private const val YELLOW_PIXEL_THRESHOLD = 18
                  private const val TAP_COOLDOWN_MS = 180L
              }
          }
          EOF_CIRCLETAP_7

          mkdir -p app/src/main/res/layout
          cat > app/src/main/res/layout/activity_main.xml <<'EOF_CIRCLETAP_8'
          <?xml version="1.0" encoding="utf-8"?>
          <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
              android:layout_width="match_parent"
              android:layout_height="match_parent"
              android:orientation="vertical"
              android:padding="24dp"
              android:gravity="center_horizontal">
          
              <TextView
                  android:layout_width="wrap_content"
                  android:layout_height="wrap_content"
                  android:text="Circle Tap Auto"
                  android:textSize="28sp"
                  android:textStyle="bold"
                  android:layout_marginTop="24dp" />
          
              <TextView
                  android:id="@+id/statusText"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="1) 접근성 권한을 켜고\n2) 감지 시작을 누르세요."
                  android:textSize="17sp"
                  android:gravity="center"
                  android:padding="20dp"
                  android:layout_marginTop="24dp" />
          
              <Button
                  android:id="@+id/accessibilityButton"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="접근성 권한 설정"
                  android:layout_marginTop="16dp" />
          
              <Button
                  android:id="@+id/startButton"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="감지 시작"
                  android:layout_marginTop="12dp" />
          
              <Button
                  android:id="@+id/stopButton"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="감지 중지"
                  android:layout_marginTop="12dp" />
          
              <TextView
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:text="기본값: 화면 중앙 부근에서 노란색이 일정량 감지되면 중앙을 1회 터치합니다. 같은 노란 화면에서는 중복 터치하지 않습니다."
                  android:textSize="14sp"
                  android:paddingTop="24dp" />
          
          </LinearLayout>
          EOF_CIRCLETAP_8

          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/strings.xml <<'EOF_CIRCLETAP_9'
          <resources>
              <string name="app_name">Circle Tap Auto</string>
              <string name="accessibility_desc">노란색 타이밍을 감지해 화면 중앙을 자동 터치합니다.</string>
          </resources>
          EOF_CIRCLETAP_9

          mkdir -p app/src/main/res/values
          cat > app/src/main/res/values/themes.xml <<'EOF_CIRCLETAP_10'
          <resources xmlns:tools="http://schemas.android.com/tools">
              <style name="Theme.CircleTapAuto" parent="Theme.MaterialComponents.DayNight.DarkActionBar">
                  <item name="colorPrimary">#3F6FD8</item>
                  <item name="colorPrimaryVariant">#345DB9</item>
                  <item name="colorOnPrimary">#FFFFFF</item>
                  <item name="android:statusBarColor">#2F5DBB</item>
              </style>
          </resources>
          EOF_CIRCLETAP_10

          mkdir -p app/src/main/res/xml
          cat > app/src/main/res/xml/accessibility_service_config.xml <<'EOF_CIRCLETAP_11'
          <?xml version="1.0" encoding="utf-8"?>
          <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
              android:accessibilityEventTypes="typeAllMask"
              android:accessibilityFeedbackType="feedbackGeneric"
              android:notificationTimeout="50"
              android:canPerformGestures="true"
              android:description="@string/accessibility_desc"
              android:settingsActivity="com.example.circletapauto.MainActivity" />
          EOF_CIRCLETAP_11

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Copy APK
        run: cp app/build/outputs/apk/debug/app-debug.apk CircleTapAuto.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CircleTapAuto-APK
          path: CircleTapAuto.apk

      - name: Publish APK release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" CircleTapAuto.apk --title "CircleTapAuto build ${GITHUB_RUN_NUMBER}" --notes "자동 빌드된 설치용 debug APK입니다." --latest
